# Minimal dnsmasq configuration for Telia Edge Router (Zyxel EX5601-T0 class)
# Memory footprint: < 2 MB RAM

# Interface to serve
interface=eth0
bind-interfaces

# DHCP range on provisioning LAN
dhcp-range=192.168.100.50,192.168.100.150,255.255.255.0,12h

# Gateway and DNS
dhcp-option=option:router,192.168.100.1
dhcp-option=option:dns-server,192.168.100.1,1.1.1.1

# Enable built-in TFTP
enable-tftp
tftp-root=/srv/tftp

# PXE bootloader logic:
# 1. First boot: client requests PXE via BIOS/UEFI -> send iPXE
# Match UEFI ARM64 (Option 93 = 11)
dhcp-match=set:efi-arm64,option:client-arch,11
dhcp-boot=tag:efi-arm64,ipxe-arm64.efi,,192.168.100.1

# Match UEFI x86-64 (Option 93 = 7 or 9)
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9
dhcp-boot=tag:efi-x86_64,ipxe-x86_64.efi,,192.168.100.1

# Match Legacy BIOS (Option 93 = 0)
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,undionly.kpxe,,192.168.100.1

# 2. Second stage: when iPXE itself boots, it sends 'ipxe' user class.
# Hand it the HTTP URL to load the dynamic boot menu
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,http://192.168.100.1:8088/boot.ipxe

# Runtime storage (G-03): the DGA4330 boots from raw NAND with a small
# jffs2/overlay. Nothing here may write to persistent flash on every request.
#   - Logs go to syslog (DAEMON facility). On Homeware/OpenWrt-class firmware
#     that is logd's RAM ring buffer, read with `logread`; never a file path.
#   - The lease database lives on tmpfs. The init script must create
#     /tmp/telia-vector (mode 0750) before starting dnsmasq, or dnsmasq
#     refuses to start rather than silently falling back to /var/lib.
log-dhcp
log-facility=DAEMON
dhcp-leasefile=/tmp/telia-vector/dnsmasq.leases
