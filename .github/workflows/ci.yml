name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        # The whole stack is one installable distribution now. This also
        # proves `pip install` works — a regression that used to ship silently.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,opentofu_ansible]'

      - name: Verify console scripts resolve
        run: |
          vme --help > /dev/null
          vne --help > /dev/null
          velocitee-discover --help > /dev/null

      - name: Lint (ruff)
        run: ruff check vme/ shared/ vne/ tools/ --select E,F,W --ignore E501,E402

      - name: Test (all suites from repo root)
        run: python -m pytest --tb=short -q

      - name: Verify engines.json drift
        # Fails the job if any marker-delimited region in core READMEs /
        # CHANGELOG has drifted from engines.json. Fix locally with:
        #   python tools/render_engine_status.py --write
        run: python tools/render_engine_status.py --check

  hygiene:
    name: Repo hygiene (pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Large files, merge markers, YAML/JSON/TOML syntax
        # The 36 MB of boot binaries in 0280835 got past check-added-large-files
        # because hooks only run where they are installed (C-01). Running the
        # hygiene hooks here makes the 1 MB cap a property of the repository,
        # not of one developer's checkout. ruff/ruff-format stay local-only
        # until the tree is formatted; the lint job above covers correctness.
        run: |
          for hook in check-added-large-files check-merge-conflict check-yaml check-json check-toml; do
            pre-commit run --all-files "$hook"
          done
